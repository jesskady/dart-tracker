<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#12161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dart Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23182029'/><circle cx='16' cy='16' r='11' fill='%232e7d4f'/><circle cx='16' cy='16' r='7' fill='%23182029'/><circle cx='16' cy='16' r='3.5' fill='%23c0392b'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ SETUP ============ -->
<section id="setup" class="screen">
  <header class="brand">
    <h1>Dart Tracker</h1>
    <p>Two-player countdown scoring</p>
  </header>

  <div class="card">
    <label class="field">
      <span>Player 1</span>
      <input id="name1" type="text" placeholder="Player 1" autocomplete="off" maxlength="14">
    </label>
    <label class="field">
      <span>Player 2</span>
      <input id="name2" type="text" placeholder="Player 2" autocomplete="off" maxlength="14">
    </label>
  </div>

  <div class="card">
    <span class="field-label">Starting score</span>
    <div class="preset-row" id="presets">
      <button class="preset" data-score="301">301</button>
      <button class="preset is-on" data-score="501">501</button>
      <button class="preset" data-score="701">701</button>
    </div>
    <label class="field">
      <span>Custom</span>
      <input id="startScore" type="number" inputmode="numeric" value="501" min="2" max="9999">
    </label>
  </div>

  <div class="card">
    <button id="doubleOut" class="toggle" role="switch" aria-checked="false">
      <span class="tg-label">
        <b>Double out</b>
        <small>Winning dart must be a double. Leaving 1 is a bust.</small>
      </span>
      <span class="tg-switch"></span>
    </button>
  </div>

  <button id="startBtn" class="primary big">Start Game</button>
  <button id="resumeBtn" class="ghost hidden">Resume saved game</button>
</section>

<!-- ============ GAME ============ -->
<section id="game" class="screen hidden">

  <div id="ruleBadge" class="rule-badge hidden">Double out</div>

  <div class="scoreboard">
    <button class="player" id="p0">
      <span class="pname"></span>
      <span class="pscore"><b class="pnum"></b><i class="ppend"></i></span>
      <span class="pmeta"></span>
    </button>
    <button class="player" id="p1">
      <span class="pname"></span>
      <span class="pscore"><b class="pnum"></b><i class="ppend"></i></span>
      <span class="pmeta"></span>
    </button>
  </div>

  <div class="turnbar">
    <div class="darts" id="dartSlots"></div>
    <div class="turntotal"><span id="turnTotal">0</span><small>this turn</small></div>
  </div>

  <div class="tabs">
    <button class="tab is-on" data-mode="darts">Darts</button>
    <button class="tab" data-mode="total">Total</button>
  </div>

  <!-- Darts entry -->
  <div id="dartsPad" class="pad">
    <div class="mult-row" id="mults">
      <button class="mult is-on" data-m="1">Single</button>
      <button class="mult" data-m="2">Double</button>
      <button class="mult" data-m="3">Triple</button>
    </div>
    <div class="numgrid" id="numgrid"></div>
    <div class="special-row">
      <button class="key special" data-bull="25">Bull 25</button>
      <button class="key special" data-miss="1">Miss</button>
      <button class="key special" id="undoDart">Undo dart</button>
    </div>
  </div>

  <!-- Lump-sum entry -->
  <div id="totalPad" class="pad hidden">
    <div class="lumpview"><span id="lumpValue">0</span></div>
    <div class="keypad" id="keypad"></div>
  </div>

  <div class="actions">
    <button id="submitBtn" class="primary big">Submit turn</button>
    <div class="mini-row">
      <button id="undoTurn" class="ghost">Undo turn</button>
      <button id="quitBtn" class="ghost">New game</button>
    </div>
  </div>

  <p id="msg" class="msg"></p>
</section>

<!-- ============ WIN ============ -->
<div id="winOverlay" class="overlay hidden">
  <div class="win-card">
    <div class="trophy">🎯</div>
    <h2 id="winName"></h2>
    <p id="winStats"></p>
    <button id="rematchBtn" class="primary big">Rematch</button>
    <button id="newBtn" class="ghost">New setup</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
